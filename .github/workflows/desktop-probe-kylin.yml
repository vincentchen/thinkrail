name: desktop-probe-kylin

on:
  workflow_dispatch:

concurrency:
  group: desktop-probe-kylin
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_URL: "https://github.com/JetBrains/thinkrail/releases/download/desktop-updates/stable-linux-x64-ThinkRail-0.3.1.tar.zst"
      KYLIN_IMAGE: "macrosan/kylin:v10-sp1"
    steps:
      - name: Download the desktop app payload (stable bundle)
        run: |
          set -euo pipefail
          curl -fL "$APP_URL" -o /tmp/app.tar.zst
          ls -la /tmp/app.tar.zst

      - name: Extract and inventory
        run: |
          set -euo pipefail
          rm -rf /tmp/b && mkdir -p /tmp/b
          tar --zstd -xf /tmp/app.tar.zst -C /tmp/b
          find /tmp/b -maxdepth 3 | head -40
          find /tmp/b -type f -name "bun" -o -type f -name "launcher" -o -maxdepth 3 -type f -perm -u+x | head -10

      - name: Native deps on the runner (sanity)
        run: |
          set -euo pipefail
          find /tmp/b -maxdepth 3 -type f -name "*" -exec file {} \; 2>/dev/null | grep -E "ELF|shared object" | head -15

      - name: Pull Kylin image
        run: docker pull --platform=linux/amd64 "$KYLIN_IMAGE"

      - name: Check every native binary against Kylin's glibc 2.28
        run: |
          set -euo pipefail
          docker run --rm --platform=linux/amd64 -v /tmp/b:/b -v /tmp:/probe \
            "$KYLIN_IMAGE" \
            bash -c 'cat /etc/.productinfo; ldd --version | head -1
                     for f in $(find /b -maxdepth 4 -type f 2>/dev/null); do
                       hdr=$(head -c 4 "$f" | od -An -tx1 | tr -d " ")
                       case "$hdr" in *7f454c46*)
                         echo "== ELF: $f"
                         (ldd "$f" 2>&1 | grep -E "not found|=>" | head -8) || true
                       ;; esac
                     done'
      - name: Try to relink/launch the launcher headless in Kylin
        run: |
          set -euo pipefail
          docker run --rm --platform=linux/amd64 -v /tmp/b:/b \
            "$KYLIN_IMAGE" \
            bash -c 'l=$(find /b -maxdepth 3 -type f -path "*bin/launcher" | head -1); echo launcher=$l
                     if [ -n "$l" ]; then ldd "$l" 2>&1 | head -20; fi
                     b=$(find /b -maxdepth 3 -type f -name bun | head -1); echo bun=$b
                     if [ -n "$b" ]; then ldd "$b" 2>&1 | head -6; "$b" --version; fi'
