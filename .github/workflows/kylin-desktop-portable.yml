# ThinkRail desktop for Kylin V10 SP1 — portable (extract & run, no install).
#
# Constraints that shaped this build:
#   * upstream needs glibc >= 2.38; Kylin V10 SP1 has 2.28; glibc cannot be
#     statically linked -> ship glibc 2.39 and start it through its own linker.
#   * ELF PT_INTERP must name the linker. For launcher/bun a *relative*
#     interpreter works because the entry script chdir()s into ThinkRail/bin.
#   * WebKitGTK looks for WebKitWebProcess at a path baked into the library, and
#     it spawns those helpers after the app has chdir()ed bun to $HOME. So the
#     helper directory and the helpers' interpreter must both be ABSOLUTE.
#     The archive is extracted anywhere, so the entry script rewrites them on
#     first start: the compiled-in dir becomes a short per-bundle symlink in
#     /tmp and each helper's PT_INTERP becomes the absolute private loader.
#     A placeholder is stamped into the binaries at build time and
#     portable-paths.txt records the byte offsets to patch.
#   * Kylin has WebKitGTK 4.0 / libsoup 2.4, upstream wants 4.1 / 3.0, so the
#     GTK3+WebKitGTK 4.1 userland comes from ubuntu:24.04 too.

name: kylin-desktop-portable

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "ThinkRail desktop bundle url"
        required: false
        default: "https://github.com/JetBrains/thinkrail/releases/download/desktop-updates/stable-linux-x64-ThinkRail-0.3.1.tar.zst"

concurrency:
  group: kylin-desktop-portable
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UBUNTU_IMAGE: "ubuntu:24.04"
      KYLIN_IMAGE: "macrosan/kylin:v10-sp1"
      REL_GLIBC: "glibc"
    steps:
      - name: Install patchelf
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y patchelf zstd

      - name: Download upstream bundle
        run: |
          set -euo pipefail
          curl -fL "${{ github.event.inputs.app_url }}" -o /tmp/app.tar.zst
          rm -rf /tmp/b && mkdir -p /tmp/b
          tar --zstd -xf /tmp/app.tar.zst -C /tmp/b

      - name: Extract glibc 2.39
        run: |
          set -euo pipefail
          docker pull --platform=linux/amd64 "$UBUNTU_IMAGE"
          rm -rf /tmp/glibc-new && mkdir -p /tmp/glibc-new
          CID=$(docker create --platform=linux/amd64 "$UBUNTU_IMAGE" /bin/true)
          for f in libc.so.6 ld-linux-x86-64.so.2 libm.so.6 libpthread.so.0 libdl.so.2 librt.so.1 libgcc_s.so.1; do
            docker cp "$CID":/lib/x86_64-linux-gnu/$f /tmp/glibc-new/ 2>/dev/null || true
          done
          docker cp "$CID":/usr/lib/x86_64-linux-gnu/libstdc++.so.6 /tmp/glibc-new/
          docker rm "$CID" >/dev/null 2>&1 || true
          ( cd /tmp/glibc-new
            for so in libc.so.6 libm.so.6 libpthread.so.0 libdl.so.2 librt.so.1 libstdc++.so.6; do
              base=$(echo "$so" | sed -E 's/\.so\.[0-9.]+$/.so/')
              [ -e "$base" ] || ln -s "$so" "$base" 2>/dev/null || true
            done )
          ls /tmp/glibc-new

      - name: Build GTK3/WebKitGTK-4.1 runtime
        run: |
          set -euo pipefail
          CID=$(docker run -d --platform=linux/amd64 "$UBUNTU_IMAGE" sleep 900)
          docker exec "$CID" bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
              libgtk-3-0t64 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 \
              libsoup-3.0-0 libgl1 libegl1 libgles2 libglx-mesa0 libdrm2 libgbm1 \
              dbus-x11 fonts-dejavu-core shared-mime-info >/dev/null
          '
          rm -rf /tmp/ub && mkdir -p /tmp/ub
          docker cp "$CID":/ /tmp/ub >/dev/null
          docker rm -f "$CID" >/dev/null

      - name: Assemble portable tree
        run: |
          set -euo pipefail
          R=/tmp/pkg/thinkrail
          rm -rf /tmp/pkg && mkdir -p "$R"
          cp -a /tmp/b/. "$R/"
          BIN="$R/ThinkRail/bin"

          # private glibc lives beside the app binaries
          mkdir -p "$BIN/$REL_GLIBC"
          cp -a /tmp/glibc-new/. "$BIN/$REL_GLIBC/"

          # GTK/WebKit userland
          mkdir -p "$R/runtime/lib" "$R/runtime/share" "$R/runtime/etc"
          cp -a /tmp/ub/usr/lib/x86_64-linux-gnu "$R/runtime/lib/"
          for d in glib-2.0 mime fonts icons webkitgtk-4.1; do
            [ -e "/tmp/ub/usr/share/$d" ] && cp -a "/tmp/ub/usr/share/$d" "$R/runtime/share/"
          done
          [ -e /tmp/ub/etc/fonts ] && cp -a /tmp/ub/etc/fonts "$R/runtime/etc/"

          # WebKit helper processes; their real location is injected at run time
          mkdir -p "$BIN/wk"
          cp -a /tmp/ub/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/. "$BIN/wk/"

          # launcher and bun are executed from bin/, so relative works for them
          patchelf --set-interpreter "$REL_GLIBC/ld-linux-x86-64.so.2" "$BIN/launcher"
          patchelf --set-interpreter "$REL_GLIBC/ld-linux-x86-64.so.2" "$BIN/bun"

          # helpers are spawned from $HOME: give them a long placeholder that
          # ./thinkrail rewrites to the absolute private loader
          WKPH=$(python3 -c "print('I'*200)")
          for f in "$BIN/wk"/WebKitWebProcess "$BIN/wk"/WebKitNetworkProcess "$BIN/wk"/WebKitGPUProcess; do
            if [ -e "$f" ] && patchelf --print-interpreter "$f" >/dev/null 2>&1; then
              patchelf --set-interpreter "$WKPH" "$f"
            fi
          done

          # compiled-in helper dir: stamp a 40-byte marker of the same length,
          # ./thinkrail fills in a short absolute symlink at run time
          python3 - <<'PY'
          import sys
          p = "/tmp/pkg/thinkrail/runtime/lib/x86_64-linux-gnu/libwebkit2gtk-4.1.so.0"
          old = b"/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1"
          marker = b"@@WK_DIR_PLACEHOLDER@@" + b"#" * (40 - len("@@WK_DIR_PLACEHOLDER@@"))
          assert len(old) == len(marker) == 40, (len(old), len(marker))
          data = open(p, "rb").read()
          n = data.count(old)
          print("occurrences:", n)
          if n == 0:
              sys.exit("compiled-in webkit dir not found - refusing to build a broken bundle")
          open(p, "wb").write(data.replace(old, marker))
          PY

          # record byte offsets that ./thinkrail patches on start
          python3 - <<'PY'
          import os
          root = "/tmp/pkg/thinkrail"
          marker = b"@@WK_DIR_PLACEHOLDER@@" + b"#" * (40 - len("@@WK_DIR_PLACEHOLDER@@"))
          ph = b"I" * 200
          lines = []
          so = "runtime/lib/x86_64-linux-gnu/libwebkit2gtk-4.1.so.0"
          data = open(os.path.join(root, so), "rb").read()
          start = 0
          while True:
              i = data.find(marker, start)
              if i < 0:
                  break
              lines.append("%s|%d|40|wk" % (so, i))
              start = i + 1
          if not lines:
              raise SystemExit("marker missing from libwebkit2gtk")
          for name in ("WebKitWebProcess", "WebKitNetworkProcess", "WebKitGPUProcess"):
              rel = "ThinkRail/bin/wk/" + name
              p = os.path.join(root, rel)
              if not os.path.exists(p):
                  continue
              d = open(p, "rb").read()
              if d.count(ph) != 1:
                  raise SystemExit("%s: unexpected interp placeholder" % rel)
              lines.append("%s|%d|%d|interp" % (rel, d.find(ph), len(ph) + 1))
          with open(os.path.join(root, "portable-paths.txt"), "w") as f:
              f.write("\n".join(lines) + "\n")
          print(open(os.path.join(root, "portable-paths.txt")).read())
          PY

          # gdk-pixbuf loader cache: keep a placeholder and expand it at run time
          CACHE="$R/runtime/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders.cache"
          if [ -f "$CACHE" ]; then
            sed -i 's|/usr/lib/x86_64-linux-gnu|@THINKRAIL@/runtime/lib/x86_64-linux-gnu|g' "$CACHE"
          fi

          cat > "$R/thinkrail" <<'WRAP'
          #!/bin/sh
          # Portable ThinkRail launcher: works from wherever the tarball was extracted.
          SELF=$(readlink -f "$0" 2>/dev/null || echo "$0")
          B=$(cd -P "$(dirname "$SELF")" && pwd)
          APP="$B/ThinkRail"
          BIN="$APP/bin"
          LIB="$B/runtime/lib/x86_64-linux-gnu"
          TMP="${TMPDIR:-/tmp}"
          LOADER="$BIN/glibc/ld-linux-x86-64.so.2"

          # gdk-pixbuf loader cache: expand the build-time placeholder. This
          # runs before LD_LIBRARY_PATH is exported so system sed stays healthy.
          if [ -f "$LIB/gdk-pixbuf-2.0/2.10.0/loaders.cache" ]; then
            if sed "s|@THINKRAIL@|$B|g" "$LIB/gdk-pixbuf-2.0/2.10.0/loaders.cache" \
                 > "$TMP/thinkrail-pixbuf-$$.cache" 2>/dev/null; then
              export GDK_PIXBUF_MODULE_FILE="$TMP/thinkrail-pixbuf-$$.cache"
            fi
          fi

          # --- absolute helper plumbing -------------------------------------
          # WebKit spawns WebKitWebProcess/WebKitNetworkProcess/WebKitGPUProcess
          # from the bun process, and the app moves that process to $HOME. Both
          # the compiled-in helper directory and the helpers' PT_INTERP would
          # then resolve against the wrong cwd, so patch them to absolute paths
          # that are valid wherever the tree was extracted.
          SHORT="/tmp/.tr-$(id -u)-$(printf %s "$B" | cksum | cut -d' ' -f1 | cut -c1-10)"
          if ! mkdir -p "$SHORT" 2>/dev/null || [ ! -O "$SHORT" ]; then
            echo "thinkrail: cannot create private runtime directory $SHORT" >&2
            exit 1
          fi
          chmod 700 "$SHORT" 2>/dev/null || true
          rm -rf "$SHORT/wk"
          ln -s "$BIN/wk" "$SHORT/wk" || {
            echo "thinkrail: cannot link WebKit helpers" >&2
            exit 1
          }

          patch_at() { # file offset width value
            f=$1; off=$2; w=$3; val=$4
            if [ ! -w "$f" ]; then
              echo "thinkrail: $f is read-only; cannot set absolute helper paths" >&2
              exit 1
            fi
            if [ "${#val}" -ge "$w" ]; then
              echo "thinkrail: path too long for $f: $val" >&2
              exit 1
            fi
            cur=$(tail -c +$((off + 1)) "$f" 2>/dev/null | head -c "$w" | tr -d '\000')
            [ "$cur" = "$val" ] && return 0
            { printf '%s' "$val"; dd if=/dev/zero bs=1 count=$((w - ${#val})) 2>/dev/null; } |
              dd of="$f" bs=1 seek="$off" conv=notrunc 2>/dev/null || {
                echo "thinkrail: cannot patch $f" >&2
                exit 1
              }
          }

          if [ -f "$B/portable-paths.txt" ]; then
            while IFS='|' read -r rel off width kind; do
              [ -n "$rel" ] || continue
              case "$kind" in
                wk)     patch_at "$B/$rel" "$off" "$width" "$SHORT/wk" ;;
                interp) patch_at "$B/$rel" "$off" "$width" "$LOADER" ;;
              esac
            done < "$B/portable-paths.txt"
          fi

          export LD_LIBRARY_PATH="$BIN/glibc:$LIB:$BIN"
          export GSETTINGS_SCHEMA_DIR="$B/runtime/share/glib-2.0/schemas"
          export XDG_DATA_DIRS="$B/runtime/share:/usr/share"
          export FONTCONFIG_PATH="$B/runtime/etc/fonts"
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export LIBGL_ALWAYS_SOFTWARE=1
          command -v bwrap >/dev/null 2>&1 || export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1

          cd "$BIN" || exit 1
          exec ./launcher "$@"
          WRAP
          chmod +x "$R/thinkrail"

          cat > "$R/README.txt" <<'EOF'
          ThinkRail desktop — portable build for Kylin V10 SP1 (x86_64)

          No installation, no root:

              tar --zstd -xf thinkrail-desktop-kylin-v10sp1-x64-portable.tar.zst
              cd thinkrail
              ./thinkrail

          You can move the directory anywhere, including a USB stick.

          What's inside:
            ThinkRail/            upstream app (bundle from JetBrains)
            ThinkRail/bin/glibc/  glibc 2.39 (Kylin V10 SP1 ships 2.28)
            runtime/              GTK3 + WebKitGTK 4.1 + libsoup3 + AppIndicator
                                  from Ubuntu 24.04 (Kylin has WebKitGTK 4.0 only)

          Why: the official Linux build needs glibc >= 2.38 and WebKitGTK 4.1.
          glibc cannot be statically linked, so this bundle carries its own
          runtime and starts everything through its private linker. Nothing in
          the system is modified.

          First start writes the absolute helper paths into the bundled binaries
          (the app chdir()s to $HOME, so relative paths cannot work there) and
          creates a small symlink under /tmp. If you move the folder, just run
          ./thinkrail again from its new location.

          Notes:
            - needs an X11 session (or Wayland with XWayland)
            - first start takes a few seconds while WebKit warms up
            - software rendering is forced (Kylin boxes often lack DRI3)
          EOF

          du -sh "$R" "$R/runtime" "$R/ThinkRail/bin/glibc"

      - name: Package
        run: |
          set -euo pipefail
          cd /tmp/pkg
          tar --zstd -cf /tmp/thinkrail-desktop-kylin-v10sp1-x64-portable.tar.zst thinkrail
          ls -lh /tmp/thinkrail-desktop-kylin-v10sp1-x64-portable.tar.zst
          sha256sum /tmp/thinkrail-desktop-kylin-v10sp1-x64-portable.tar.zst

      - name: Smoke test on Kylin V10 SP1 (Xvfb)
        run: |
          set -uo pipefail
          rm -rf /tmp/smoke && mkdir -p /tmp/smoke
          tar --zstd -xf /tmp/thinkrail-desktop-kylin-v10sp1-x64-portable.tar.zst -C /tmp/smoke
          cat > /tmp/smoke.sh <<'SH'
          #!/bin/bash
          set -x
          timeout 240 yum install -y xorg-x11-server-Xvfb strace >/dev/null 2>&1 || true
          Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 &
          sleep 3
          export DISPLAY=:99
          cd /tmp
          strace -f -e trace=execve,chdir -o /tmp/trace.txt /pkg/thinkrail/thinkrail > /tmp/app.log 2>&1 &
          APP=$!
          sleep 25
          echo "--- app.log ---"; cat /tmp/app.log
          echo "--- bun cwd ---"
          for p in $(pgrep -f "ThinkRail/bin/bun" || true); do echo "bun $p cwd=$(readlink /proc/$p/cwd 2>&1)"; done
          echo "--- trace execve/chdir ---"
          grep -nE "WebKit|chdir" /tmp/trace.txt 2>/dev/null | head -40
          echo "--- ps ---"
          ps -ef | grep -E "launcher|bun|WebKit" | grep -v grep | head
          set +x
          echo "--- verdict ---"
          ps -ef | grep -q "[W]ebKitWebProcess" && echo "SMOKE_WEBKIT_OK" || echo "SMOKE_WEBKIT_MISSING"
          ps -ef | grep -q "[W]ebKitNetworkProcess" && echo "SMOKE_NET_OK" || echo "SMOKE_NET_MISSING"
          grep -q "listening on port" /tmp/app.log && echo "SMOKE_HOST_OK" || echo "SMOKE_HOST_MISSING"
          echo "--- helper from HOME (no relative cwd) ---"
          cd /root || cd /
          timeout 5 env LD_LIBRARY_PATH=/pkg/thinkrail/ThinkRail/bin/glibc:/pkg/thinkrail/runtime/lib/x86_64-linux-gnu:/pkg/thinkrail/ThinkRail/bin /pkg/thinkrail/ThinkRail/bin/wk/WebKitNetworkProcess >/tmp/h3.log 2>&1
          echo "SMOKE_HELPER_RC=$?"
          head -3 /tmp/h3.log
          kill -9 $APP 2>/dev/null || true
          pkill -9 -f ThinkRail 2>/dev/null || true
          echo "--- done ---"
          SH
          chmod +x /tmp/smoke.sh
          timeout 300 docker run --rm --name tr-smoke --platform=linux/amd64 \
            -v /tmp/smoke:/pkg -v /tmp/smoke.sh:/smoke.sh:ro \
            "$KYLIN_IMAGE" bash /smoke.sh 2>&1 | tee /tmp/smoke.log || true
          docker kill tr-smoke 2>/dev/null || true
          echo "=== verdict ==="
          grep -q "SMOKE_WEBKIT_OK" /tmp/smoke.log && echo "WEBKIT_OK" || echo "WEBKIT_MISSING"
          grep -q "SMOKE_NET_OK" /tmp/smoke.log && echo "NET_OK" || echo "NET_MISSING"
          grep -q "SMOKE_HOST_OK" /tmp/smoke.log && echo "HOST_OK" || echo "HOST_MISSING"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thinkrail-desktop-kylin-v10sp1-x64-portable
          path: |
            /tmp/thinkrail-desktop-kylin-v10sp1-x64-portable.tar.zst
            /tmp/smoke.log
          if-no-files-found: warn
