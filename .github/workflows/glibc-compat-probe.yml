name: glibc-compat-probe

on:
  workflow_dispatch:

concurrency:
  group: glibc-compat-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KYLIN_IMAGE: "macrosan/kylin:v10-sp1"
      UBUNTU_IMAGE: "ubuntu:24.04"
      APP_URL: "https://github.com/JetBrains/thinkrail/releases/download/desktop-updates/stable-linux-x64-ThinkRail-0.3.1.tar.zst"
    steps:
      - name: Install patchelf on runner
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y patchelf
          patchelf --version

      - name: Download ThinkRail desktop bundle
        run: |
          set -euo pipefail
          curl -fL "$APP_URL" -o /tmp/app.tar.zst
          rm -rf /tmp/b && mkdir -p /tmp/b
          tar --zstd -xf /tmp/app.tar.zst -C /tmp/b
          ls -la /tmp/b/ThinkRail/bin | head

      - name: Extract glibc 2.39 from ubuntu:24.04
        run: |
          set -euo pipefail
          docker pull --platform=linux/amd64 "$UBUNTU_IMAGE"
          rm -rf /tmp/glibc-new && mkdir -p /tmp/glibc-new/lib /tmp/glibc-new/usr/lib
          CID=$(docker create --platform=linux/amd64 "$UBUNTU_IMAGE" /bin/true)
          for f in libc.so.6 ld-linux-x86-64.so.2 libm.so.6 libpthread.so.0 libdl.so.2 librt.so.1 libgcc_s.so.1; do
            docker cp "$CID":/lib/x86_64-linux-gnu/$f /tmp/glibc-new/lib/ || true
          done
          docker cp "$CID":/usr/lib/x86_64-linux-gnu/libstdc++.so.6 /tmp/glibc-new/usr/lib/
          cd /tmp/glibc-new/lib
          for so in libc.so.6 libm.so.6 libpthread.so.0 libdl.so.2 librt.so.1; do
            base=${so%.so.6}
            [ -e "$base.so" ] || ln -s "$so" "$base.so" 2>/dev/null || true
          done
          docker rm "$CID" >/dev/null 2>&1 || true
          /tmp/glibc-new/lib/ld-linux-x86-64.so.2 --version 2>&1 | head -2

      - name: Build ubuntu 24.04 GUI runtime tree (gtk3 + webkit2gtk-4.1 + appindicator)
        run: |
          set -euo pipefail
          CID=$(docker run -d --platform=linux/amd64 "$UBUNTU_IMAGE" sleep 300)
          docker exec "$CID" bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
              libgtk-3-0t64 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 \
              libsoup-3.0-0 libgl1 libegl1 libgles2 libglx-mesa0 libdrm2 libgbm1 \
              xvfb dbus-x11 fonts-dejavu-core shared-mime-info >/dev/null
          '
          rm -rf /tmp/ub && mkdir -p /tmp/ub
          docker cp "$CID":/ /tmp/ub >/dev/null
          docker rm -f "$CID" >/dev/null
          echo "=== runtime tree size ==="
          du -sh /tmp/ub/usr/lib/x86_64-linux-gnu /tmp/ub/usr/share 2>/dev/null | tail -3
          ls /tmp/ub/usr/lib/x86_64-linux-gnu/libwebkit2gtk-4.1.so.0 \
             /tmp/ub/usr/lib/x86_64-linux-gnu/libsoup-3.0.so.0 \
             /tmp/ub/usr/lib/x86_64-linux-gnu/libayatana-appindicator3.so.1

      - name: Patch interpreters of every ELF in the runtime tree
        run: |
          set -euo pipefail
          NEW=/opt/glibc-new/lib/ld-linux-x86-64.so.2
          count=0
          while IFS= read -r -d '' f; do
            if head -c 4 "$f" | grep -q $'\x7fELF'; then
              if readelf -h "$f" 2>/dev/null | grep -q 'Type:.*DYN\|Type:.*EXEC'; then
                patchelf --set-interpreter "$NEW" --set-rpath "/opt/glibc-new/lib:/opt/glibc-new/usr/lib:/u/usr/lib/x86_64-linux-gnu:/b/ThinkRail/bin" "$f" 2>/dev/null && count=$((count+1)) || true
              fi
            fi
          done < <(find /tmp/ub/usr/lib/x86_64-linux-gnu /tmp/ub/usr/bin /tmp/ub/usr/libexec -maxdepth 3 -type f -print0 2>/dev/null)
          echo "patched $count ELF files"
          RP='/opt/glibc-new/lib:/opt/glibc-new/usr/lib:/u/usr/lib/x86_64-linux-gnu:/b/ThinkRail/bin'
          for f in /tmp/b/ThinkRail/bin/launcher /tmp/b/ThinkRail/bin/bun; do
            patchelf --set-interpreter /opt/glibc-new/lib/ld-linux-x86-64.so.2 --set-rpath "$RP" "$f"
            patchelf --print-interpreter "$f"
            patchelf --print-rpath "$f"
          done

      - name: Write probe script
        run: |
          cat > /tmp/probe.sh <<'SH'
          #!/bin/bash
          set -x
          echo "=== gui lib presence ==="
          ls -l /u/usr/lib/x86_64-linux-gnu/libGLdispatch* /u/usr/lib/x86_64-linux-gnu/libGLX* 2>&1 | head
          echo "=== Xvfb rpath ==="
          patchelf --print-rpath /u/usr/bin/Xvfb 2>&1

          echo "=== try kylin xvfb package ==="
          (yum install -y xorg-x11-server-Xvfb 2>&1 | tail -3) || true
          which Xvfb || true

          export GSETTINGS_SCHEMA_DIR=/u/usr/share/glib-2.0/schemas
          export XDG_DATA_DIRS=/u/usr/share:/usr/share
          export FONTCONFIG_PATH=/u/etc/fonts
          export GDK_PIXBUF_MODULE_FILE=/u/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders.cache
          export WEBKIT_EXEC_PATH=/u/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1
          export WEBKIT_INJECTED_BUNDLE_PATH=/u/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/injected-bundle
          export GDK_BACKEND=x11
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1

          echo "=== start Xvfb (kylin) ==="
          (Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 &) || true
          sleep 3
          tail -3 /tmp/xvfb.log 2>/dev/null
          export DISPLAY=:99
          xdpyinfo 2>&1 | head -3 || true

          echo "=== launcher run ==="
          ( timeout 45 /b/ThinkRail/bin/launcher > /tmp/launcher.log 2>&1 ; echo "exit=$?" ) 
          echo "--- launcher.log ---"
          cat /tmp/launcher.log
          SH
          chmod +x /tmp/probe.sh

      - name: Run on Kylin V10 SP1
        run: |
          set -euo pipefail
          docker run --rm --platform=linux/amd64 \
            -v /tmp/b:/b \
            -v /tmp/glibc-new:/opt/glibc-new:ro \
            -v /tmp/ub:/u:ro \
            -v /tmp/probe.sh:/probe.sh:ro \
            "$KYLIN_IMAGE" \
            bash /probe.sh
