name: glibc-compat-probe

on:
  workflow_dispatch:

concurrency:
  group: glibc-compat-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KYLIN_IMAGE: "macrosan/kylin:v10-sp1"
      UBUNTU_IMAGE: "ubuntu:24.04"
      APP_URL: "https://github.com/JetBrains/thinkrail/releases/download/desktop-updates/stable-linux-x64-ThinkRail-0.3.1.tar.zst"
    steps:
      - name: Install patchelf on runner
        run: |
          set -euo pipefail
          which patchelf || (sudo apt-get update -y && sudo apt-get install -y patchelf)
          patchelf --version

      - name: Download ThinkRail desktop bundle
        run: |
          set -euo pipefail
          curl -fL "$APP_URL" -o /tmp/app.tar.zst
          rm -rf /tmp/b && mkdir -p /tmp/b
          tar --zstd -xf /tmp/app.tar.zst -C /tmp/b
          find /tmp/b -maxdepth 3 | head -20

      - name: Extract newer glibc + libstdc++ from ubuntu:24.04
        run: |
          set -euo pipefail
          docker pull --platform=linux/amd64 "$UBUNTU_IMAGE"
          rm -rf /tmp/glibc-new && mkdir -p /tmp/glibc-new/lib /tmp/glibc-new/usr/lib
          UBUNTU_CID=$(docker create "$UBUNTU_IMAGE" /bin/true)
          docker cp "$UBUNTU_CID":/lib/x86_64-linux-gnu/libc.so.6 /tmp/glibc-new/lib/
          docker cp "$UBUNTU_CID":/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 /tmp/glibc-new/lib/
          docker cp "$UBUNTU_CID":/lib/x86_64-linux-gnu/libm.so.6 /tmp/glibc-new/lib/
          docker cp "$UBUNTU_CID":/lib/x86_64-linux-gnu/libpthread.so.0 /tmp/glibc-new/lib/
          docker cp "$UBUNTU_CID":/lib/x86_64-linux-gnu/libdl.so.2 /tmp/glibc-new/lib/
          docker cp "$UBUNTU_CID":/usr/lib/x86_64-linux-gnu/libstdc++.so.6 /tmp/glibc-new/usr/lib/
          cd /tmp/glibc-new/lib
          for so in libc.so.6 libm.so.6 libpthread.so.0 libdl.so.2; do
            base=${so%.so.6}
            [ -e "$base.so" ] || ln -s "$so" "$base.so"
          done
          cd /tmp/glibc-new/usr/lib
          [ -e libstdc++.so ] || ln -s libstdc++.so.6 libstdc++.so
          docker cp "$UBUNTU_CID":/lib/x86_64-linux-gnu/libgcc_s.so.1 /tmp/glibc-new/lib/ 2>/dev/null || true
          docker rm "$UBUNTU_CID" >/dev/null 2>&1 || true
          echo "=== staged glibc-new ==="
          ls -la /tmp/glibc-new/lib /tmp/glibc-new/usr/lib
          /tmp/glibc-new/lib/ld-linux-x86-64.so.2 --version 2>&1 | head -3 || true

      - name: Patchelf launcher+bun interpreter to the new glibc linker
        run: |
          set -euo pipefail
          patchelf --set-interpreter /opt/glibc-new/lib/ld-linux-x86-64.so.2 /tmp/b/ThinkRail/bin/launcher
          patchelf --set-interpreter /opt/glibc-new/lib/ld-linux-x86-64.so.2 /tmp/b/ThinkRail/bin/bun
          patchelf --print-interpreter /tmp/b/ThinkRail/bin/launcher
          patchelf --print-interpreter /tmp/b/ThinkRail/bin/bun

      - name: Run ThinkRail launcher on Kylin with staged glibc
        run: |
          set -euo pipefail
          docker run --rm --platform=linux/amd64 \
            -v /tmp/b:/b \
            -v /tmp/glibc-new:/opt/glibc-new:ro \
            "$KYLIN_IMAGE" \
            bash -c '
              cat /etc/.productinfo
              echo "=== install binutils ==="
              (yum install -y binutils 2>&1 | tail -3) || true
              echo "=== libNativeWrapper.so NEEDED ==="
              readelf -d /b/ThinkRail/bin/libNativeWrapper.so 2>&1 | grep NEEDED || echo "readelf still missing"
              echo "=== ldd libNativeWrapper.so (bin in path) ==="
              LD_LIBRARY_PATH=/opt/glibc-new/lib:/opt/glibc-new/usr/lib:/b/ThinkRail/bin \
                /opt/glibc-new/lib/ld-linux-x86-64.so.2 --list /b/ThinkRail/bin/libNativeWrapper.so 2>&1 || true
              echo "=== dlopen dlerror via python ==="
              LD_LIBRARY_PATH=/opt/glibc-new/lib:/opt/glibc-new/usr/lib:/b/ThinkRail/bin \
                /opt/glibc-new/lib/ld-linux-x86-64.so.2 /usr/bin/python3 -c "
import ctypes
try:
    ctypes.CDLL("/b/ThinkRail/bin/libNativeWrapper.so")
    print("dlopen OK")
except OSError as e:
    print("dlerror:", e)
" 2>&1 | head -5 || true
              echo "=== yum available GUI pkgs ==="
              (yum list available 2>/dev/null | grep -iE "^(webkit2gtk|gtk3|libX11|appindicator|libayatana)" | head -20) || true
              echo "=== launcher --version ==="
              LD_LIBRARY_PATH=/opt/glibc-new/lib:/opt/glibc-new/usr/lib:/b/ThinkRail/bin \
                /b/ThinkRail/bin/launcher --version 2>&1 | head -40 || true
            '
