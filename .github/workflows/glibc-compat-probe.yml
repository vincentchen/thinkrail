# Probe: run ThinkRail desktop on Kylin V10 SP1 using an extracted newer glibc.
#
# Idea: glibc cannot be statically linked (upstream forbids it), but we can ship a newer
# glibc alongside the app and invoke it via its own dynamic linker:
#   LD_LIBRARY_PATH=/opt/glibc-new/lib /opt/glibc-new/lib/ld-linux-x86-64.so.2 ./launcher --version
#
# Steps:
#   1. Pull ubuntu:24.04 (glibc 2.39) and copy its runtime libs to a staging dir on the runner.
#   2. Upload the staging dir as an artifact (optional, for inspection).
#   3. Inside Kylin V10 SP1 container: place libs under /opt/glibc-new, then run ThinkRail's
#      launcher and bun against the new linker, capture ldd and --version output.
#
# Trigger: workflow_dispatch.

name: glibc-compat-probe

on:
  workflow_dispatch:

concurrency:
  group: glibc-compat-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KYLIN_IMAGE: "macrosan/kylin:v10-sp1"
      UBUNTU_IMAGE: "ubuntu:24.04"
      APP_URL: "https://github.com/JetBrains/thinkrail/releases/download/desktop-updates/stable-linux-x64-ThinkRail-0.3.1.tar.zst"
    steps:
      - name: Download ThinkRail desktop bundle
        run: |
          set -euo pipefail
          curl -fL "$APP_URL" -o /tmp/app.tar.zst
          rm -rf /tmp/b && mkdir -p /tmp/b
          tar --zstd -xf /tmp/app.tar.zst -C /tmp/b
          find /tmp/b -maxdepth 3 | head -20

      - name: Extract newer glibc + libstdc++ from ubuntu:24.04
        run: |
          set -euo pipefail
          docker pull --platform=linux/amd64 "$UBUNTU_IMAGE"
          rm -rf /tmp/glibc-new && mkdir -p /tmp/glibc-new/lib /tmp/glibc-new/usr/lib
          UBUNTU_CID=$(docker create "$UBUNTU_IMAGE" /bin/true)
          docker cp "$UBUNTU_CID":/lib/x86_64-linux-gnu/libc.so.6 /tmp/glibc-new/lib/
          docker cp "$UBUNTU_CID":/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 /tmp/glibc-new/lib/
          docker cp "$UBUNTU_CID":/lib/x86_64-linux-gnu/libm.so.6 /tmp/glibc-new/lib/
          docker cp "$UBUNTU_CID":/lib/x86_64-linux-gnu/libpthread.so.0 /tmp/glibc-new/lib/
          docker cp "$UBUNTU_CID":/lib/x86_64-linux-gnu/libdl.so.2 /tmp/glibc-new/lib/
          docker cp "$UBUNTU_CID":/usr/lib/x86_64-linux-gnu/libstdc++.so.6 /tmp/glibc-new/usr/lib/
          # symlink versionless names the linker expects
          cd /tmp/glibc-new/lib
          for so in libc.so.6 libm.so.6 libpthread.so.0 libdl.so.2; do
            base=${so%.so.6}
            [ -e "$base.so" ] || ln -s "$so" "$base.so"
          done
          cd /tmp/glibc-new/usr/lib
          [ -e libstdc++.so ] || ln -s libstdc++.so.6 libstdc++.so
          # also grab the gcc_s lib if present
          docker cp "$UBUNTU_CID":/lib/x86_64-linux-gnu/libgcc_s.so.1 /tmp/glibc-new/lib/ 2>/dev/null || true
          docker rm "$UBUNTU_CID" >/dev/null 2>&1 || true
          echo "=== staged glibc-new ==="
          ls -la /tmp/glibc-new/lib /tmp/glibc-new/usr/lib
          /tmp/glibc-new/lib/ld-linux-x86-64.so.2 --version 2>&1 | head -3 || true

      - name: Upload staged glibc (inspection)
        uses: actions/upload-artifact@v4
        with:
          name: glibc-new-stage
          path: /tmp/glibc-new
          if-no-files-found: error

      - name: Run ThinkRail launcher on Kylin with new glibc
        run: |
          set -euo pipefail
          docker run --rm --platform=linux/amd64 \
            -v /tmp/b:/b \
            -v /tmp/glibc-new:/opt/glibc-new:ro \
            "$KYLIN_IMAGE" \
            bash -c '
              cat /etc/.productinfo
              ldd --version | head -1
              echo "=== stage glibc libs beside the bundle bin ==="
              cp /opt/glibc-new/lib/* /b/ThinkRail/bin/
              cp /opt/glibc-new/usr/lib/libstdc++.so.6 /b/ThinkRail/bin/
              # versionless symlinks some libs may dlopen by name
              cd /b/ThinkRail/bin
              for so in libc.so.6 libm.so.6 libpthread.so.0 libdl.so.2 libstdc++.so.6 libgcc_s.so.1; do
                base=${so%.so.*}
                [ -e "$base.so" ] || ln -sf "$so" "$base.so" 2>/dev/null || true
              done
              cd /b/ThinkRail
              echo "=== launcher ldd with staged glibc ==="
              LD_LIBRARY_PATH=/b/ThinkRail/bin ldd /b/ThinkRail/bin/launcher 2>&1 | head -20 || true
              echo "=== launcher --version ==="
              LD_LIBRARY_PATH=/b/ThinkRail/bin /b/ThinkRail/bin/launcher --version 2>&1 | head -30 || true
              echo "=== bun --version ==="
              LD_LIBRARY_PATH=/b/ThinkRail/bin /b/ThinkRail/bin/bun --version 2>&1 | head -10 || true
            '
